esphome:
  name: sterownik-rolety-podwojny
  friendly_name: rolety1_salon
  platformio_options:
    board_build.f_cpu: 160000000L

esp8266:
  board: nodemcuv2

logger:
  level: ERROR
  baud_rate: 0

api:
  batch_delay: 0ms
  encryption:
    key: "xxxxxx"

ota:
  - platform: esphome
    password: "xxxxxxxx"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  power_save_mode: NONE
  ap:
    ssid: "Rolety1 Fallback Hotspot"
    password: "xxxxxxx"

captive_portal:

substitutions:
  r1_name: "Roleta Lewa"
  r1_max_kroki: "42800"
  r2_name: "Roleta Prawa"
  r2_max_kroki: "44100"
  predkosc: "300"
  przyspieszenie: "80"

preferences:
  flash_write_interval: 1h

globals:
  - id: r1_inverted
    type: bool
    restore_value: true
    initial_value: 'false'

  - id: r2_inverted
    type: bool
    restore_value: true
    initial_value: 'false'

switch:
  - platform: template
    name: "Roleta Lewa - odwrocony kierunek"
    id: r1_invert_switch
    entity_category: config
    lambda: |-
      return id(r1_inverted);
    turn_on_action:
      - globals.set:
          id: r1_inverted
          value: 'true'
    turn_off_action:
      - globals.set:
          id: r1_inverted
          value: 'false'

  - platform: template
    name: "Roleta Prawa - odwrocony kierunek"
    id: r2_invert_switch
    entity_category: config
    lambda: |-
      return id(r2_inverted);
    turn_on_action:
      - globals.set:
          id: r2_inverted
          value: 'true'
    turn_off_action:
      - globals.set:
          id: r2_inverted
          value: 'false'

stepper:
  - platform: uln2003
    id: stepper_1
    pin_a: GPIO14
    pin_b: GPIO12
    pin_c: GPIO13
    pin_d: GPIO15
    max_speed: ${predkosc}
    acceleration: ${przyspieszenie}
    sleep_when_done: true
    step_mode: FULL_STEP

  - platform: uln2003
    id: stepper_2
    pin_a: GPIO5
    pin_b: GPIO4
    pin_c: GPIO0
    pin_d: GPIO2
    max_speed: ${predkosc}
    acceleration: ${przyspieszenie}
    sleep_when_done: true
    step_mode: FULL_STEP

button:
  - platform: template
    name: "Roleta Lewa - ustaw jako otwarta"
    entity_category: config
    on_press:
      - stepper.report_position:
          id: stepper_1
          position: !lambda |-
            return id(r1_inverted) ? ${r1_max_kroki} : 0;
      - stepper.set_target:
          id: stepper_1
          target: !lambda |-
            return id(r1_inverted) ? ${r1_max_kroki} : 0;
      - cover.template.publish:
          id: cover_1
          position: 1.0
          current_operation: IDLE

  - platform: template
    name: "Roleta Lewa - ustaw jako zamknieta"
    entity_category: config
    on_press:
      - stepper.report_position:
          id: stepper_1
          position: !lambda |-
            return id(r1_inverted) ? 0 : ${r1_max_kroki};
      - stepper.set_target:
          id: stepper_1
          target: !lambda |-
            return id(r1_inverted) ? 0 : ${r1_max_kroki};
      - cover.template.publish:
          id: cover_1
          position: 0.0
          current_operation: IDLE

  - platform: template
    name: "Roleta Prawa - ustaw jako otwarta"
    entity_category: config
    on_press:
      - stepper.report_position:
          id: stepper_2
          position: !lambda |-
            return id(r2_inverted) ? ${r2_max_kroki} : 0;
      - stepper.set_target:
          id: stepper_2
          target: !lambda |-
            return id(r2_inverted) ? ${r2_max_kroki} : 0;
      - cover.template.publish:
          id: cover_2
          position: 1.0
          current_operation: IDLE

  - platform: template
    name: "Roleta Prawa - ustaw jako zamknieta"
    entity_category: config
    on_press:
      - stepper.report_position:
          id: stepper_2
          position: !lambda |-
            return id(r2_inverted) ? 0 : ${r2_max_kroki};
      - stepper.set_target:
          id: stepper_2
          target: !lambda |-
            return id(r2_inverted) ? 0 : ${r2_max_kroki};
      - cover.template.publish:
          id: cover_2
          position: 0.0
          current_operation: IDLE

cover:
  - platform: template
    name: ${r1_name}
    id: cover_1
    device_class: blind
    has_position: true
    open_action:
      - stepper.set_target:
          id: stepper_1
          target: !lambda |-
            return id(r1_inverted) ? ${r1_max_kroki} : 0;
      - cover.template.publish:
          id: cover_1
          current_operation: OPENING

    close_action:
      - stepper.set_target:
          id: stepper_1
          target: !lambda |-
            return id(r1_inverted) ? 0 : ${r1_max_kroki};
      - cover.template.publish:
          id: cover_1
          current_operation: CLOSING

    stop_action:
      - stepper.set_target:
          id: stepper_1
          target: !lambda |-
            return id(stepper_1).current_position;
      - cover.template.publish:
          id: cover_1
          position: !lambda |-
            float raw = (float) id(stepper_1).current_position / ${r1_max_kroki}.0f;
            float position = id(r1_inverted) ? raw : 1.0f - raw;
            if (position < 0.0f) return 0.0f;
            if (position > 1.0f) return 1.0f;
            return position;
          current_operation: IDLE

    position_action:
      - stepper.set_target:
          id: stepper_1
          target: !lambda |-
            return id(r1_inverted) ? pos * ${r1_max_kroki} : (1.0f - pos) * ${r1_max_kroki};
      - cover.template.publish:
          id: cover_1
          current_operation: !lambda |-
            if (id(stepper_1).current_position == id(stepper_1).target_position) {
              return COVER_OPERATION_IDLE;
            }
            bool moving_to_higher_steps = id(stepper_1).current_position < id(stepper_1).target_position;
            if (id(r1_inverted)) {
              return moving_to_higher_steps ? COVER_OPERATION_OPENING : COVER_OPERATION_CLOSING;
            } else {
              return moving_to_higher_steps ? COVER_OPERATION_CLOSING : COVER_OPERATION_OPENING;
            }

  - platform: template
    name: ${r2_name}
    id: cover_2
    device_class: blind
    has_position: true
    open_action:
      - stepper.set_target:
          id: stepper_2
          target: !lambda |-
            return id(r2_inverted) ? ${r2_max_kroki} : 0;
      - cover.template.publish:
          id: cover_2
          current_operation: OPENING

    close_action:
      - stepper.set_target:
          id: stepper_2
          target: !lambda |-
            return id(r2_inverted) ? 0 : ${r2_max_kroki};
      - cover.template.publish:
          id: cover_2
          current_operation: CLOSING

    stop_action:
      - stepper.set_target:
          id: stepper_2
          target: !lambda |-
            return id(stepper_2).current_position;
      - cover.template.publish:
          id: cover_2
          position: !lambda |-
            float raw = (float) id(stepper_2).current_position / ${r2_max_kroki}.0f;
            float position = id(r2_inverted) ? raw : 1.0f - raw;
            if (position < 0.0f) return 0.0f;
            if (position > 1.0f) return 1.0f;
            return position;
          current_operation: IDLE

    position_action:
      - stepper.set_target:
          id: stepper_2
          target: !lambda |-
            return id(r2_inverted) ? pos * ${r2_max_kroki} : (1.0f - pos) * ${r2_max_kroki};
      - cover.template.publish:
          id: cover_2
          current_operation: !lambda |-
            if (id(stepper_2).current_position == id(stepper_2).target_position) {
              return COVER_OPERATION_IDLE;
            }
            bool moving_to_higher_steps = id(stepper_2).current_position < id(stepper_2).target_position;
            if (id(r2_inverted)) {
              return moving_to_higher_steps ? COVER_OPERATION_OPENING : COVER_OPERATION_CLOSING;
            } else {
              return moving_to_higher_steps ? COVER_OPERATION_CLOSING : COVER_OPERATION_OPENING;
            }

interval:
  - interval: 500ms
    then:
      - cover.template.publish:
          id: cover_1
          position: !lambda |-
            float raw = (float) id(stepper_1).current_position / ${r1_max_kroki}.0f;
            float position = id(r1_inverted) ? raw : 1.0f - raw;
            if (position < 0.0f) return 0.0f;
            if (position > 1.0f) return 1.0f;
            return position;
          current_operation: !lambda |-
            if (id(stepper_1).current_position == id(stepper_1).target_position) {
              return COVER_OPERATION_IDLE;
            }
            bool moving_to_higher_steps = id(stepper_1).current_position < id(stepper_1).target_position;
            if (id(r1_inverted)) {
              return moving_to_higher_steps ? COVER_OPERATION_OPENING : COVER_OPERATION_CLOSING;
            } else {
              return moving_to_higher_steps ? COVER_OPERATION_CLOSING : COVER_OPERATION_OPENING;
            }

      - cover.template.publish:
          id: cover_2
          position: !lambda |-
            float raw = (float) id(stepper_2).current_position / ${r2_max_kroki}.0f;
            float position = id(r2_inverted) ? raw : 1.0f - raw;
            if (position < 0.0f) return 0.0f;
            if (position > 1.0f) return 1.0f;
            return position;
          current_operation: !lambda |-
            if (id(stepper_2).current_position == id(stepper_2).target_position) {
              return COVER_OPERATION_IDLE;
            }
            bool moving_to_higher_steps = id(stepper_2).current_position < id(stepper_2).target_position;
            if (id(r2_inverted)) {
              return moving_to_higher_steps ? COVER_OPERATION_OPENING : COVER_OPERATION_CLOSING;
            } else {
              return moving_to_higher_steps ? COVER_OPERATION_CLOSING : COVER_OPERATION_OPENING;
            }
