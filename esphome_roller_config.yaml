esphome:
  name: sterownik-rolety-podwojny
  friendly_name: rolety1_salon
  platformio_options:
    board_build.f_cpu: 160000000L

esp8266:
  board: esp01_1m

logger:
  level: ERROR
  baud_rate: 0

api:
  batch_delay: 0ms
  encryption:
    key: "flIgyK3JFxcxcMs="

ota:
  - platform: esphome
    password: "xcxcxcccc"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  power_save_mode: NONE
  ap:
    ssid: "Rolety1 Fallback Hotspot"
    password: "xxxxxxxx"

captive_portal:

substitutions:
  r1_name: "Roleta Lewa"
  # PODZIELONE PRZEZ 2 (z 20000 na 10000) z racji FULL_STEP
  r1_max_kroki: "10000"
  r2_name: "Roleta Prawa"
  r2_max_kroki: "10000"
  
  # Prędkość również podzielona przez 2, aby zachować to samo tempo fizyczne
  predkosc: "300" 
  przyspieszenie: "80"

preferences:
  flash_write_interval: 1h

stepper:
  - platform: uln2003
    id: stepper_1
    pin_a: GPIO14
    pin_b: GPIO12
    pin_c: GPIO13
    pin_d: GPIO15
    max_speed: ${predkosc}
    acceleration: ${przyspieszenie}
    sleep_when_done: true
    # MAGIA OPTYMALIZACJI: Pełny krok. Zmniejsza obciążenie ESP o połowę!
    step_mode: FULL_STEP 

  - platform: uln2003
    id: stepper_2
    pin_a: GPIO5
    pin_b: GPIO4
    pin_c: GPIO0
    pin_d: GPIO2
    max_speed: ${predkosc}
    acceleration: ${przyspieszenie}
    sleep_when_done: true
    step_mode: FULL_STEP

cover:
  - platform: template
    name: ${r1_name}
    id: cover_1
    device_class: blind
    has_position: true
    open_action:
      - stepper.set_target:
          id: stepper_1
          target: 0
      - cover.template.publish:
          id: cover_1
          current_operation: OPENING

    close_action:
      - stepper.set_target:
          id: stepper_1
          target: ${r1_max_kroki}
      - cover.template.publish:
          id: cover_1
          current_operation: CLOSING

    stop_action:
      - stepper.set_target:
          id: stepper_1
          target: !lambda 'return id(stepper_1).current_position;'
      - cover.template.publish:
          id: cover_1
          position: !lambda |-
            return 1.0f - ((float) id(stepper_1).current_position / ${r1_max_kroki}.0f);
          current_operation: IDLE

    position_action:
      - stepper.set_target:
          id: stepper_1
          target: !lambda 'return (1.0f - pos) * ${r1_max_kroki};'
      - cover.template.publish:
          id: cover_1
          current_operation: !lambda |-
            if (id(stepper_1).current_position < id(stepper_1).target_position) {
              return COVER_OPERATION_CLOSING;
            } else if (id(stepper_1).current_position > id(stepper_1).target_position) {
              return COVER_OPERATION_OPENING;
            } else {
              return COVER_OPERATION_IDLE;
            }

  - platform: template
    name: ${r2_name}
    id: cover_2
    device_class: blind
    has_position: true
    open_action:
      - stepper.set_target:
          id: stepper_2
          target: 0
      - cover.template.publish:
          id: cover_2
          current_operation: OPENING

    close_action:
      - stepper.set_target:
          id: stepper_2
          target: ${r2_max_kroki}
      - cover.template.publish:
          id: cover_2
          current_operation: CLOSING

    stop_action:
      - stepper.set_target:
          id: stepper_2
          target: !lambda 'return id(stepper_2).current_position;'
      - cover.template.publish:
          id: cover_2
          position: !lambda |-
            return 1.0f - ((float) id(stepper_2).current_position / ${r2_max_kroki}.0f);
          current_operation: IDLE

    position_action:
      - stepper.set_target:
          id: stepper_2
          target: !lambda 'return (1.0f - pos) * ${r2_max_kroki};'
      - cover.template.publish:
          id: cover_2
          current_operation: !lambda |-
            if (id(stepper_2).current_position < id(stepper_2).target_position) {
              return COVER_OPERATION_CLOSING;
            } else if (id(stepper_2).current_position > id(stepper_2).target_position) {
              return COVER_OPERATION_OPENING;
            } else {
              return COVER_OPERATION_IDLE;
            }

interval:
  - interval: 500ms
    then:
      - cover.template.publish:
          id: cover_1
          position: !lambda |-
            return 1.0f - ((float) id(stepper_1).current_position / ${r1_max_kroki}.0f);
          current_operation: !lambda |-
            if (id(stepper_1).current_position < id(stepper_1).target_position) {
              return COVER_OPERATION_CLOSING;
            } else if (id(stepper_1).current_position > id(stepper_1).target_position) {
              return COVER_OPERATION_OPENING;
            } else {
              return COVER_OPERATION_IDLE;
            }

      - cover.template.publish:
          id: cover_2
          position: !lambda |-
            return 1.0f - ((float) id(stepper_2).current_position / ${r2_max_kroki}.0f);
          current_operation: !lambda |-
            if (id(stepper_2).current_position < id(stepper_2).target_position) {
              return COVER_OPERATION_CLOSING;
            } else if (id(stepper_2).current_position > id(stepper_2).target_position) {
              return COVER_OPERATION_OPENING;
            } else {
              return COVER_OPERATION_IDLE;
            }
