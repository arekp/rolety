esphome:
  name: rolety1
  friendly_name: rolety1

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# ============================================
# Wi-Fi Konfiguracja
# ============================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Rolety1 Fallback Hotspot"
    password: "2d890Nt9GLfM"

captive_portal:

# ============================================
# Enable logging
# ============================================
logger:
  level: INFO

# ============================================
# Enable Home Assistant API
# ============================================
api:
  encryption:
    key: "d1K6Qe5PoLYRR0DO3qJanXc4JJPgnMPtkxVUfTIdvf4="

# ============================================
# OTA Updates
# ============================================
ota:
  - platform: esphome
    password: "da32dc05b4f8badde6840699cc6b25be"

# ============================================
# Stepper Motor - ULN2003 28BYJ-48
# NodeMCU v3 pinning: D5-D8 → GPIO14, GPIO12, GPIO13, GPIO27
# ============================================
stepper:
  - platform: uln2003
    id: my_stepper
    pin_a: GPIO14      # D5 → ULN2003 IN1
    pin_b: GPIO12      # D6 → ULN2003 IN2
    pin_c: GPIO13      # D7 → ULN2003 IN3
    pin_d: GPIO27      # D8 → ULN2003 IN4
    max_speed: 500
    acceleration: 200
    deceleration: 200
    sleep_when_done: true

# ============================================
# Cover (Roleta) z Stepper'em - Template Cover
# Nowa wersja dla ESPHome 2026.5.3+
# ============================================
cover:
  - platform: template
    name: "Rolety1"
    id: my_cover
    
    # Otwórz roletę (ustaw target na max)
    open_action:
      then:
        - stepper.set_target:
            id: my_stepper
            target: 20000
        - logger.log: "Roleta: otwieranie..."
    
    # Zamknij roletę (ustaw target na 0)
    close_action:
      then:
        - stepper.set_target:
            id: my_stepper
            target: 0
        - logger.log: "Roleta: zamykanie..."
    
    # Zatrzymaj roletę (ustaw target na aktualną pozycję)
    stop_action:
      then:
        - stepper.set_target:
            id: my_stepper
            target: !lambda 'return id(my_stepper).current_position;'
        - logger.log: "Roleta: zatrzymana"
    
    # Oblicz aktualną operację
    current_operation: !lambda |-
      if (id(my_stepper).current_position == id(my_stepper).target_position) {
        return cover::COVER_OPERATION_IDLE;
      } else if (id(my_stepper).target_position > id(my_stepper).current_position) {
        return cover::COVER_OPERATION_OPENING;
      } else {
        return cover::COVER_OPERATION_CLOSING;
      }
    
    # Oblicz pozycję jako procent (0.0 = zamknięte, 1.0 = otwarte)
    current_position: !lambda |-
      return id(my_stepper).current_position / 20000.0;
    
    # Przywróć pozycję po restarcie
    restore_position: true
    
    # Włącz możliwość ustawienia pozycji na podstawie procentu (Home Assistant)
    has_position: true
    
    # Ustaw pozycję na podstawie procentu z Home Assistant
    set_position_action:
      then:
        - stepper.set_target:
            id: my_stepper
            target: !lambda 'return pos * 20000.0;'

# ============================================
# Przyciski Sterowania (GPIO)
# NodeMCU v3: GPIO5 (D1), GPIO4 (D2), GPIO0 (D3)
# ============================================
binary_sensor:
  # Przycisk "Do Góry" (GPIO5 / D1)
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Przycisk Góra"
    id: btn_up
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - cover.open: my_cover
  
  # Przycisk "Do Dołu" (GPIO4 / D2)
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    name: "Przycisk Dół"
    id: btn_down
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - cover.close: my_cover
  
  # Przycisk "Stop" (GPIO0 / D3)
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Przycisk Stop"
    id: btn_stop
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - cover.stop: my_cover

# ============================================
# Sensory Diagnostyczne
# ============================================
sensor:
  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal
    update_interval: 60s

  # Uptime
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s

  # Napięcie Zasilania (GPIO35 / A0)
  - platform: adc
    pin: GPIO35
    attenuation: 11db
    name: "Napięcie Zasilania"
    id: power_voltage
    update_interval: 60s
    filters:
      - multiply: 4.2  # Kalibracja dla dzielnika napięcia

# ============================================
# Text Sensors
# ============================================
text_sensor:
  # Status WiFi
  - platform: wifi_info
    ip_address:
      name: "IP Adres"
      id: wifi_ip
    ssid:
      name: "SSID"
      id: wifi_ssid
    mac_address:
      name: "MAC Address"
      id: wifi_mac

  # Wersja ESPHome
  - platform: version
    name: "ESPHome Version"
    id: esphome_version

# ============================================
# Switches - Sterowanie
# ============================================
switch:
  # Restart
  - platform: restart
    name: "Restart NodeMCU v3"
    id: restart_switch

  # Safe Mode (do aktualizacji)
  - platform: safe_mode
    name: "Restart Safe Mode"
    id: safe_mode_switch

# ============================================
# Automatyzacja (Examples)
# ============================================
automation:
  # Otwórz roletę o 7:00 rano
  - alias: "Otwórz roletę rano"
    trigger:
      platform: time
      at: "07:00:00"
    action:
      - cover.open: my_cover
  
  # Zamknij roletę o 21:00
  - alias: "Zamknij roletę wieczorem"
    trigger:
      platform: time
      at: "21:00:00"
    action:
      - cover.close: my_cover

# ============================================
# Scripts (Możliwe sekwencje działań)
# ============================================
script:
  otwórz_roletę:
    then:
      - cover.open: my_cover
      - delay: 2s
      - logger.log: "Roleta otwarta"

  zamknij_roletę:
    then:
      - cover.close: my_cover
      - delay: 2s
      - logger.log: "Roleta zamknięta"

  stop_roletę:
    then:
      - cover.stop: my_cover
      - logger.log: "Roleta zatrzymana"
