esphome:
  name: rolety1
  friendly_name: rolety1

esp8266:
  board: esp01_1m

# ============================================
# Wi-Fi Konfiguracja
# ============================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Rolety1 Fallback Hotspot"
    password: "2d890Nt9GLfM"

captive_portal:

# ============================================
# Enable logging
# ============================================
logger:
  level: INFO

# ============================================
# Enable Home Assistant API
# ============================================
api:
  encryption:
    key: "d1K6Qe5PoLYRR0DO3qJanXc4JJPgnMPtkxVUfTIdvf4="

# ============================================
# OTA Updates
# ============================================
ota:
  - platform: esphome
    password: "da32dc05b4f8badde6840699cc6b25be"

# ============================================
# Stepper Motor - ULN2003 28BYJ-48
# ============================================
stepper:
  - platform: uln2003
    id: my_stepper
    pin_a: GPIO14      # D5 → ULN2003 IN1
    pin_b: GPIO12      # D6 → ULN2003 IN2
    pin_c: GPIO13      # D7 → ULN2003 IN3
    pin_d: GPIO27      # D8 → ULN2003 IN4
    max_speed: 500
    acceleration: 200
    deceleration: 200
    sleep_when_done: true

# ============================================
# Cover (Roleta) z Stepper'em
# ============================================
cover:
  - platform: stepper
    name: "Rolety1"
    id: my_cover
    stepper_id: my_stepper
    
    # Liczba kroków dla pełnego rozwinięcia
    # 28BYJ-48: 4096 kroków = 1 pełny obrót
    # Dostosuj eksperymentalnie dla Twojej instalacji!
    full_steps: 20000
    
    # Odwróć kierunek ruchu (jeśli potrzebne)
    # direction_inverted: false
    
    # Przywróć pozycję po restarcie
    restore_position: true

# ============================================
# Przyciski Sterowania (GPIO)
# ============================================
binary_sensor:
  # Przycisk "Do Góry" (GPIO5)
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Przycisk Góra"
    id: btn_up
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - cover.open: my_cover
  
  # Przycisk "Do Dołu" (GPIO4)
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    name: "Przycisk Dół"
    id: btn_down
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - cover.close: my_cover
  
  # Przycisk "Stop" (GPIO0)
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Przycisk Stop"
    id: btn_stop
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - cover.stop: my_cover

# ============================================
# Sensory Diagnostyczne
# ============================================
sensor:
  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal
    update_interval: 60s

  # Uptime
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s

# ============================================
# Text Sensors
# ============================================
text_sensor:
  # Status WiFi
  - platform: wifi_info
    ip_address:
      name: "IP Adres"
      id: wifi_ip
    ssid:
      name: "SSID"
      id: wifi_ssid
    mac_address:
      name: "MAC Address"
      id: wifi_mac

  # Wersja ESPHome
  - platform: version
    name: "ESPHome Version"
    id: esphome_version

# ============================================
# Switches - Sterowanie
# ============================================
switch:
  # Restart
  - platform: restart
    name: "Restart ESP8266"
    id: restart_switch

  # Safe Mode (do aktualizacji)
  - platform: safe_mode
    name: "Restart Safe Mode"
    id: safe_mode_switch

# ============================================
# Automatyzacja (Examples)
# ============================================
automation:
  # Otwórz roletę o 7:00 rano
  - alias: "Otwórz roletę rano"
    trigger:
      platform: time
      at: "07:00:00"
    action:
      - cover.open: my_cover
  
  # Zamknij roletę o 21:00
  - alias: "Zamknij roletę wieczorem"
    trigger:
      platform: time
      at: "21:00:00"
    action:
      - cover.close: my_cover

# ============================================
# Scripts (Możliwe sekwencje działań)
# ============================================
script:
  otwórz_roletę:
    then:
      - cover.open: my_cover
      - delay: 2s
      - logger.log: "Roleta otwarta"

  zamknij_roletę:
    then:
      - cover.close: my_cover
      - delay: 2s
      - logger.log: "Roleta zamknięta"

  stop_roletę:
    then:
      - cover.stop: my_cover
      - logger.log: "Roleta zatrzymana"
