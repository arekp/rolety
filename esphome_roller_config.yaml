esphome:
  name: roleta-krokowa
  friendly_name: Roleta Salon
  platform: ESP32
  board: esp32dev

# ============================================
# Wi-Fi Konfiguracja
# ============================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Fallback AP (gdy WiFi niedostępny)
  ap:
    ssid: "Roleta-Krokowa-AP"
    password: "12345678"

# ============================================
# Wdrażanie OTA (Over-The-Air)
# ============================================
ota:
  password: !secret ota_password

# ============================================
# Home Assistant API
# ============================================
api:
  encryption:
    key: !secret api_key

# ============================================
# Logger
# ============================================
logger:
  level: INFO
  # logs:
  #   component: DEBUG

# ============================================
# MQTT (Opcjonalnie - do Home Assistant)
# ============================================
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: true
  discovery_prefix: homeassistant

# ============================================
# Stepper Motor - ULN2003 28BYJ-48
# ============================================
stepper:
  - platform: uln2003
    id: my_stepper
    pin_a: GPIO14      # D5 → ULN2003 IN1
    pin_b: GPIO12      # D6 → ULN2003 IN2
    pin_c: GPIO13      # D7 → ULN2003 IN3
    pin_d: GPIO27      # D8 → ULN2003 IN4
    max_speed: 500
    acceleration: 200
    deceleration: 200
    sleep_when_done: true

# ============================================
# Cover (Roleta) z Stepper'em
# ============================================
cover:
  - platform: stepper
    name: "Roleta Salon"
    id: my_cover
    stepper_id: my_stepper
    
    # Liczba kroków dla pełnego rozwinięcia
    # 28BYJ-48: 4096 kroków = 1 pełny obrót
    # Dostosuj eksperymentalnie dla Twojej instalacji!
    full_steps: 20000
    
    # Odwróć kierunek ruchu (jeśli potrzebne)
    # direction_inverted: false
    
    # Opcjonalne: Przywróć pozycję po restarcie
    # restore_position: true

# ============================================
# Przyciski Sterowania (GPIO)
# ============================================
binary_sensor:
  # Przycisk "Do Góry" (GPIO26)
  - platform: gpio
    pin:
      number: GPIO26
      mode: INPUT_PULLUP
      inverted: true
    name: "Przycisk Góra"
    id: btn_up
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - cover.open: my_cover
  
  # Przycisk "Do Dołu" (GPIO25)
  - platform: gpio
    pin:
      number: GPIO25
      mode: INPUT_PULLUP
      inverted: true
    name: "Przycisk Dół"
    id: btn_down
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - cover.close: my_cover
  
  # Przycisk "Stop" (GPIO33)
  - platform: gpio
    pin:
      number: GPIO33
      mode: INPUT_PULLUP
      inverted: true
    name: "Przycisk Stop"
    id: btn_stop
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - cover.stop: my_cover

# ============================================
# Sensory Diagnostyczne
# ============================================
sensor:
  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal
    update_interval: 60s

  # Uptime
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s

  # Napięcie Zasilania (opcjonalne - wymaga ADC)
  - platform: adc
    pin: GPIO35
    attenuation: 11db
    name: "Napięcie Zasilania"
    id: power_voltage
    update_interval: 60s
    filters:
      - multiply: 4.2  # Kalibracja dla dzielnika napięcia

# ============================================
# Text Sensors
# ============================================
text_sensor:
  # Status WiFi
  - platform: wifi_info
    ip_address:
      name: "IP Adres"
      id: wifi_ip
    ssid:
      name: "SSID"
      id: wifi_ssid
    bssid:
      name: "BSSID"
      id: wifi_bssid
    mac_address:
      name: "MAC Address"
      id: wifi_mac

  # Wersja ESPHome
  - platform: version
    name: "ESPHome Version"
    id: esphome_version

# ============================================
# Switches - Sterowanie
# ============================================
switch:
  # Restart
  - platform: restart
    name: "Restart ESP32"
    id: restart_switch

  # Safe Mode (do aktualizacji)
  - platform: safe_mode
    name: "Restart Safe Mode"
    id: safe_mode_switch

# ============================================
# Servos - Pozycjonowanie (opcjonalne)
# ============================================
# servo:
#   - id: my_servo
#     output: pwm_servo
#     min_level: 0%
#     max_level: 100%

# ============================================
# PWM Output (jeśli potrzebny)
# ============================================
# output:
#   - platform: ledc
#     pin: GPIO32
#     id: pwm_servo
#     frequency: 50 Hz

# ============================================
# Globalny Timer do Automatyki
# ============================================
interval:
  - interval: 60s
    then:
      - logger.log: "System działa prawidłowo"

# ============================================
# Automatyzacja (Examples)
# ============================================
automation:
  # Otwórz roletę o 7:00 rano
  - alias: "Otwórz roletę rano"
    trigger:
      platform: time
      at: "07:00:00"
    action:
      - cover.open: my_cover
  
  # Zamknij roletę o 21:00
  - alias: "Zamknij roletę wieczorem"
    trigger:
      platform: time
      at: "21:00:00"
    action:
      - cover.close: my_cover

# ============================================
# Scripts (Możliwe sekwencje działań)
# ============================================
script:
  otwórz_roletę:
    then:
      - cover.open: my_cover
      - delay: 2s
      - logger.log: "Roleta otwarta"

  zamknij_roletę:
    then:
      - cover.close: my_cover
      - delay: 2s
      - logger.log: "Roleta zamknięta"

  stop_roletę:
    then:
      - cover.stop: my_cover
      - logger.log: "Roleta zatrzymana"
